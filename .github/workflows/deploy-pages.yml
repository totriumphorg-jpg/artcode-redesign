name: Publish ARTCODE website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка pnpm
        uses: pnpm/action-setup@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сайта
        run: pnpm run build:pages

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация сайта
        id: deployment
        uses: actions/deploy-pages@v4
